<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark background circle -->
  <circle cx="32" cy="32" r="32" fill="#1a1a1a"/>
  <!-- Gear shape in red -->
  <g fill="#CC0000">
    <!-- Outer gear teeth -->
    <rect x="27" y="2" width="10" height="10" rx="2"/>
    <rect x="27" y="52" width="10" height="10" rx="2"/>
    <rect x="2" y="27" width="10" height="10" rx="2"/>
    <rect x="52" y="27" width="10" height="10" rx="2"/>
    <rect x="8" y="8" width="9" height="9" rx="2" transform="rotate(45 12.5 12.5)"/>
    <rect x="47" y="8" width="9" height="9" rx="2" transform="rotate(45 51.5 12.5)"/>
    <rect x="8" y="47" width="9" height="9" rx="2" transform="rotate(45 12.5 51.5)"/>
    <rect x="47" y="47" width="9" height="9" rx="2" transform="rotate(45 51.5 51.5)"/>
    <!-- Main gear body -->
    <circle cx="32" cy="32" r="18"/>
  </g>
  <!-- Inner hole -->
  <circle cx="32" cy="32" r="9" fill="#1a1a1a"/>
  <!-- Small red dot center -->
  <circle cx="32" cy="32" r="4" fill="#CC0000"/>
</svg>